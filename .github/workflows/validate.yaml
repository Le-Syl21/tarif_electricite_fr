name: Validate

# Built and tested locally; CI only guards what gets tagged.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # pytest-homeassistant-custom-component needs 3.14; on 3.13 pip
          # silently picks an old release and an old Home Assistant.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # hassfest has no releases worth following: it checks against Home
      # Assistant's current rules, so it is pinned to a recent master commit.
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93  # master 2026-09-10

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: integration
