name: "Mes heures creuses / My off-peak hours"
description: "Partagez les heures creuses de votre distributeur / Share your distributor's off-peak hours"
title: "[HC] <distributeur> – <commune>"
labels: ["heures-creuses"]
body:
  - type: markdown
    attributes:
      value: |
        Les heures creuses sont fixées par le **distributeur** (Enedis ou l'entreprise locale), compteur par compteur. On cherche à savoir quels distributeurs appliquent **les mêmes horaires à tous leurs clients**, pour les proposer automatiquement.
        Off-peak hours are set by the **distributor** (Enedis or the local company), meter by meter. We want to find out which distributors give **the same hours to all their customers**, so the integration can suggest them.

        ⚠️ Ne publiez **pas** votre numéro de compteur (PDL / PRM), votre adresse ni votre nom. / Do **not** post your meter number (PDL / PRM), address or name.
  - type: input
    id: distributeur
    attributes:
      label: "Distributeur / Distributor"
      description: "Celui de votre commune sur la carte https://dataviz.agenceore.fr/distributeurs-energie-france/ — par exemple Enedis, SICAE ELY, GÉRÉDIS"
    validations:
      required: true
  - type: input
    id: commune
    attributes:
      label: "Commune (et code postal) / Town (and postcode)"
    validations:
      required: true
  - type: input
    id: heures
    attributes:
      label: "Heures creuses / Off-peak hours"
      description: "Telles qu'écrites sur la facture ou l'espace client, par exemple « HC (22H30-6H30) » ou 01:30-07:30, 12:30-14:30"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: "Où les avez-vous lues ? / Where did you read them?"
      options:
        - "Facture / Bill"
        - "Espace client du distributeur (Enedis, SICAE…) / Distributor's customer area"
        - "MyElectricalData"
        - "Compteur (téléinformation) / Meter (teleinfo)"
        - "Autre / Other"
    validations:
      required: true
  - type: dropdown
    id: compteur
    attributes:
      label: "Compteur / Meter"
      options:
        - "Linky"
        - "Électronique (avant Linky) / Electronic (pre-Linky)"
        - "Électromécanique (à roue) / Electromechanical"
        - "Je ne sais pas / Don't know"
  - type: input
    id: depuis
    attributes:
      label: "Depuis quand ? / Since when?"
      description: "Si vous le savez : date du dernier changement d'horaires / If known: date of the last change"
  - type: textarea
    id: remarques
    attributes:
      label: "Remarques / Notes"
      description: "Vos voisins ont-ils les mêmes horaires ? Courrier du distributeur annonçant un changement ? / Do your neighbours have the same hours? A letter announcing a change?"
